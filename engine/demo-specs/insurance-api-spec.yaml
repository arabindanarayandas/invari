    RegisterClaimRequest:
      type: object
      required:
        - policyId
        - claimantId
        - claimType
        - incidentDate
        - notificationDate
        - claimedAmountPence
        - claimDescription
        - claimChannel
      properties:
        policyId:
          type: string
          format: uuid
          example: "q2r3s4t5-6789-0123-4567-89abcdef0123"
        claimantId:
          type: string
          format: uuid
          example: "r3s4t5u6-7890-1234-5678-9abcdef01234"
        claimType:
          type: string
          enum: [death, critical_illness, income_protection, total_permanent_disability, property_damage, theft, liability, health_treatment, dental, optical]
          example: "property_damage"
        incidentDate:
          type: string
          format: date
          description: "YYYY-MM-DD — when the insured event occurred"
          example: "2026-03-15"
        notificationDate:
          type: string
          format: date
          description: "YYYY-MM-DD — when the claim was reported"
          example: "2026-03-17"
        claimedAmountPence:
          type: integer
          minimum: 1
          description: "Amount being claimed in pence"
          example: 850000
        claimDescription:
          type: string
          minLength: 20
          maxLength: 5000
          example: "Water leak from upstairs bathroom caused ceiling damage in living room and damaged furniture. Leak was caused by failed pipe joint. Emergency plumber attended and repaired the leak. Now require ceiling repair and replacement of damaged sofa and carpet."
        claimChannel:
          type: string
          enum: [phone, online, post, adviser, app, third_party]
          example: "online"
        thirdPartyInvolved:
          type: boolean
          default: false
          example: false
        thirdPartyDetails:
          type: string
          maxLength: 1000
          example: ""
        policeReportNumber:
          type: string
          maxLength: 50
          example: ""
        hospitalAdmissionDate:
          type: string
          format: date
          example: "2026-03-15"
        hospitalDischargeDate:
          type: string
          format: date
          example: "2026-03-16"
        diagnosisCodes:
          type: array
          items:
            type: string
            pattern: '^[A-Z]\d{2}(\.\d{1,4})?$'
          example: []
        attachedDocumentIds:
          type: array
          items:
            type: string
            format: uuid
          example: ["s4t5u6v7-8901-2345-6789-0abcdef12345", "t5u6v7w8-9012-3456-789a-bcdef0123456"]
        urgentPaymentRequired:
          type: boolean
          default: false
          example: false
        bankAccountForPayment:
          type: string
          format: uuid
          example: "u6v7w8x9-0123-4567-890a-bcdef1234567"
      example:
        policyId: "q2r3s4t5-6789-0123-4567-89abcdef0123"
        claimantId: "r3s4t5u6-7890-1234-5678-9abcdef01234"
        claimType: "property_damage"
        incidentDate: "2026-03-15"
        notificationDate: "2026-03-17"
        claimedAmountPence: 850000
        claimDescription: "Water leak from upstairs bathroom caused ceiling damage in living room and damaged furniture. Leak was caused by failed pipe joint. Emergency plumber attended and repaired the leak. Now require ceiling repair and replacement of damaged sofa and carpet."
        claimChannel: "online"
        thirdPartyInvolved: false
        attachedDocumentIds: ["s4t5u6v7-8901-2345-6789-0abcdef12345", "t5u6v7w8-9012-3456-789a-bcdef0123456"]
        urgentPaymentRequired: false
        bankAccountForPayment: "u6v7w8x9-0123-4567-890a-bcdef1234567"

    Claim:
